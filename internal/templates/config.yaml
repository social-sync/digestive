# Example digestive configuration.
#
# ${VAR} references are substituted from the environment (a .env file in the
# working directory is also consulted; real environment variables win). A
# reference with no value and no ${VAR:-default} fails the run loudly.

source:
  # go-sql-driver/mysql DSN. SingleStore is MySQL wire compatible.
  dsn: ${SINGLESTORE_DSN}

destination:
  # Local directory. Each run writes into a timestamped sub-directory.
  directory: ./exports

# Optional. Only used by `digestive sync`, which runs an export and applies its
# INSERTs straight into a live database (existing schema required — sync does
# not create tables). Uncomment and set a DSN to use it.
# sync:
#   dsn: ${SYNC_DSN}   # go-sql-driver/mysql DSN for the destination
#   type: mysql        # mysql or singlestore

# Optional. Turns on audit logging: when present, `export` and `sync` write a
# per-run audit record and REQUIRE --requester-name / --requester-email. Set
# exactly one of `directory` (local) or `s3` (S3-compatible storage).
# compliance:
#   audit:
#     directory: ./audit-logs
#     # s3:
#     #   endpoint: ${AUDIT_S3_ENDPOINT}     # host[:port], no scheme
#     #   bucket: ${AUDIT_S3_BUCKET}
#     #   prefix: exports/
#     #   region: ${AUDIT_S3_REGION:-us-east-1}
#     #   access_key_id: ${AUDIT_S3_ACCESS_KEY}
#     #   secret_access_key: ${AUDIT_S3_SECRET_KEY}
#     #   use_ssl: true
#     #   path_style: true

hashing:
  # HMAC secret for deterministic hashing. Keep it out of the file and stable
  # across runs, or pseudonyms (and joins) will change.
  key: ${EXPORT_HASH_KEY}

tables:
  # Quick path: a bare table name exports the whole table, untransformed.
  - countries

  # Full form: row-reduction plus per-column transforms.
  - name: users
    where: "created_at > '2024-01-01'"   # raw SQL, trusted config
    order_by: "id"                       # makes LIMIT deterministic
    limit: 10000
    columns:
      email:
        transform: hash_email            # stays email-shaped
      full_name:
        transform: mask                  # keep first/last, mask the middle
        keep_first: 1
        keep_last: 0
      ssn:
        transform: constant
        value: "REDACTED"
      deleted_reason:
        transform: "null"                # column must be nullable

  - name: orders
    columns:
      # A shared value hashes identically everywhere, so this still joins to
      # users.email above.
      user_email:
        transform: hash_email

  - name: registrations
    columns:
      # Anonymise the values inside a json column while keeping its shape, so it
      # still deserializes into the same object. Default-deny: every leaf you do
      # not keep or name is anonymised automatically (strings hashed, numbers -> 0,
      # nulls/empty-strings/booleans preserved). Name a path only to give it a
      # nicer transform, and keep the non-PII structure you want readable.
      payload:
        transform: json_anonymise
        json:
          paths:
            details.email: { transform: hash_email }   # must stay email-shaped
            details.phone: { transform: mask, keep_last: 3 }
          keep:
            - details.marketingConsent                  # non-PII, keep readable
